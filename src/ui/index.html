<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>dianAI｜Merge Preview 測試</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #101827; color: #f8fafc; font-family: system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 36px; text-align: center; border: 1px solid #334155; border-radius: 20px; background: #1e293b; }
    .tag { color: #93c5fd; font-size: 12px; letter-spacing: .12em; }
    h1 { margin: 12px 0 8px; font-size: 26px; }
    p { color: #cbd5e1; }
    output { display: block; margin: 28px 0; font-size: 64px; font-weight: 700; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #60a5fa; color: #0f172a; font-size: 18px; font-weight: 700; cursor: pointer; }
    button:hover { background: #93c5fd; }
    small { display: block; margin-top: 20px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="tag">DIANAI · MERGE PREVIEW</div>
    <h1>按鈕測試</h1>
    <p>目前版本：main（合併前）</p>
    <output id="count" aria-live="polite">0</output>
    <button id="add" type="button">按一下 +2</button>
    <small>每次點擊，數字增加 2</small>
  </main>
  <script>
    let count = 0;
    const output = document.querySelector("#count");
    document.querySelector("#add").addEventListener("click", () => {
      count += 2;
      output.textContent = count;
    });
  </script>
</body>
</html>
