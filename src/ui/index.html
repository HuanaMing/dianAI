<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#37339D">
  <meta name="description" content="流形迴響：一個會回應你行為的俯視角生存射擊原型。">
  <title>流形迴響｜MANIFOLD ECHOES</title>
  <style>
    :root{color-scheme:dark;--blue:#5D81C7;--space:#37339D;--energy:#9CC9D9;--red:#BE4449;--grey:#B3B3B3;--white:#F3F3F3;--ink:#333333}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--white);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif}
    body{min-height:100dvh;display:flex;justify-content:center;padding:14px}
    .shell{width:min(100%,1100px);display:flex;flex-direction:column;gap:10px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
    .brand{font-weight:850;letter-spacing:.12em;font-size:clamp(15px,2.5vw,21px)}.brand span{display:block;color:var(--energy);font-size:10px;letter-spacing:.24em;font-weight:600;margin-top:3px}
    .hint{font-size:12px;color:var(--grey);text-align:right}
    .hud{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:8px}
    .stat{background:var(--space);border:1px solid var(--grey);border-radius:10px;padding:8px 10px;min-width:0}
    .stat label{display:block;color:var(--energy);font-size:10px;letter-spacing:.12em}.stat strong{font-size:15px;font-variant-numeric:tabular-nums}
    .meter{height:5px;background:var(--ink);border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:100%;background:var(--blue)}
    .stage{position:relative;flex:1;min-height:420px;height:min(68vh,700px);border:1px solid var(--grey);border-radius:14px;overflow:hidden;background:var(--space);touch-action:none}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .message{position:absolute;top:10px;left:12px;right:12px;text-align:center;pointer-events:none;color:var(--white);font-size:12px;text-shadow:0 1px 3px var(--ink)}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:rgba(51,51,51,.78);z-index:3}
    .overlay[hidden]{display:none}.panel{width:min(100%,520px);padding:24px;border:1px solid var(--energy);border-radius:16px;background:var(--space);text-align:center;box-shadow:0 14px 50px rgba(51,51,51,.45)}
    h1{font-size:clamp(23px,5vw,34px);margin:0 0 10px;letter-spacing:.04em}.panel p{color:var(--energy);font-size:14px;line-height:1.7;margin:0 0 18px}
    .actions{display:grid;gap:9px}.action{width:100%;border:1px solid var(--energy);border-radius:9px;padding:12px 14px;background:var(--blue);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;text-align:left}.action:hover,.action:focus-visible{outline:2px solid var(--white);outline-offset:2px;background:var(--energy)}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--grey);font-size:12px}
    .mobile-controls{display:none;align-items:end;justify-content:space-between;pointer-events:none;position:absolute;inset:auto 14px 14px;z-index:2}
    #joystick{width:116px;height:116px;border:1px solid var(--energy);border-radius:50%;background:rgba(55,51,157,.45);pointer-events:auto;touch-action:none;display:grid;place-items:center}
    #stick{width:44px;height:44px;border-radius:50%;background:var(--blue);border:2px solid var(--white);pointer-events:none}
    #rotate{pointer-events:auto;border:1px solid var(--energy);border-radius:12px;background:var(--space);color:var(--white);padding:12px 14px;font-weight:700;touch-action:manipulation}
    .legend{display:flex;flex-wrap:wrap;gap:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
    @media(max-width:650px){body{padding:8px}.hud{grid-template-columns:repeat(4,1fr)}.stat:first-child{grid-column:span 2}.stage{height:65dvh;min-height:390px}.hint{display:none}.mobile-controls{display:flex}.controls{font-size:11px}.desktop-only{display:none}}
    @media(hover:none){.mobile-controls{display:flex}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand">流形迴響 <span>MANIFOLD ECHOES · GAMEPLAY PROTOTYPE</span></div><div class="hint">WASD / 方向鍵移動　·　E 旋轉方塊　·　子彈自動發射</div></header>
    <section class="hud" aria-label="戰鬥狀態">
      <div class="stat"><label>VITALITY</label><strong id="hp">100 / 100</strong><div class="meter"><i id="hp-fill"></i></div></div>
      <div class="stat"><label>RESONANCE</label><strong id="xp">0 / 5</strong><div class="meter"><i id="xp-fill"></i></div></div>
      <div class="stat"><label>LEVEL</label><strong id="level">1</strong></div>
      <div class="stat"><label>TIME</label><strong id="time">00:00</strong></div>
      <div class="stat"><label>KILLS / SCORE</label><strong><span id="kills">0</span> / <span id="score">0</span></strong></div>
    </section>
    <section class="stage">
      <canvas id="arena" aria-label="俯視角生存射擊遊戲戰場"></canvas>
      <div class="message" id="message">移動、閃避，讓空間替你作戰。</div>
      <div class="mobile-controls"><div id="joystick" aria-label="移動搖桿"><div id="stick"></div></div><button id="rotate" type="button">旋轉方塊 ↻</button></div>
      <div class="overlay" id="overlay">
        <div class="panel"><h1 id="overlay-title">流形迴響</h1><p id="overlay-copy"></p><div class="actions" id="overlay-actions"></div></div>
      </div>
    </section>
    <footer class="controls"><div class="legend"><span><i class="dot" style="background:#5D81C7"></i>玩家</span><span><i class="dot" style="background:#BE4449"></i>敵人</span><span><i class="dot" style="background:#9CC9D9"></i>能量／可操控方塊</span><span><i class="dot" style="background:#B3B3B3"></i>固定結構</span></div><span class="desktop-only">擊敗敵人收集能量，升級卡片會參考你的近期玩法。</span></footer>
  </main>
  <script type="module" src="./game/main.js"></script>
</body>
</html>
